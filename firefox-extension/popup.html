<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Pocket Demo Bot</title>
<style>
  body { width: 280px; font-family: sans-serif; font-size: 13px; margin: 0; padding: 12px; background: #222; color: #fff; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .row { margin: 6px 0; }
  .ok { color: #2ecc71; } .bad { color: #e74c3c; } .warn { color: #f39c12; }
  button { padding: 8px 14px; border: none; border-radius: 6px; font-size: 14px; margin: 4px 4px 0 0; cursor: pointer; }
  #start { background: #27ae60; color: #fff; }
  #stop { background: #c0392b; color: #fff; }
  .note { font-size: 11px; color: #aaa; margin-top: 10px; }
  #status { white-space: pre-wrap; word-wrap: break-word; background: #333; padding: 8px; border-radius: 6px; }
</style>
</head>
<body>
  <h1>🤖 Pocket Demo Bot</h1>
  <div class="row">الحساب: <b>ديمو فقط</b> — أتمتة مخالفة لشروط المنصة وقد تؤدي للحظر.</div>
  <div id="status">جارٍ تحميل الحالة...</div>
  <div class="row">
    <button id="start">▶ START</button>
    <button id="stop">⛔ STOP</button>
  </div>
  <div class="row"><a href="https://pocketoption.com/" target="_blank" style="color:#3498db">فتح Pocket Option (ديمو)</a></div>
  <div class="note">لا تُعرض هنا أي قيمة جلسة (كوكي/SSID) أبداً — الجلسة تبقى في ذاكرة متصفحك فقط. السعر يأتي من سوكيت المنصة نفسه. بلا ضمان ربح.</div>
  <script src="popup.js"></script>
</body>
</html>
