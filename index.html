:root{--accent:#e62e04;--dark:#111;--muted:#666;--line:#e5e5e5;--bg:#f6f6f8;--card:#fff;--radius:14px}

function t(k){ return STR[lang][k] || STR.ar[k] || k; }
function loc(p){ return lang === 'en' ? (p.name_en || p.name) : p.name; }
function locDesc(p){ return lang === 'en' ? (p.description_en || p.description || '') : (p.description || ''); }

function fmt(egp){
  if (lang === 'en') return '$' + (egp / rate).toFixed(2);
  return Number(egp).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ' + t('currencySuffix');
}
function fmtNum(n){ return Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

function stars(r){
  if (!r) return '';
  var full = Math.round(r);
  var s = '';
  for (var i = 0; i < 5; i++) s += (i < full) ? '★' : '☆';
  return s + ' <small>' + r + '</small>';
}

function getCart(){
  try { return JSON.parse(localStorage.getItem('hs-cart') || '[]'); } catch(e) { return []; }
}
function setCart(c){
  try { localStorage.setItem('hs-cart', JSON.stringify(c)); } catch(e) {}
  updateCartBadge();
}
function updateCartBadge(){
  var c = getCart();
  var n = 0; c.forEach(function(i){ n += i.qty; });

  el.style.display = n ? 'flex' : 'none';

}

  document.getElementById('productsTitle').textContent = t('productsTitle');
  document.getElementById('productsSub').textContent = t('productsSub');
  document.getElementById('maxPriceLabel').textContent = t('maxPrice');
  document.getElementById('usdNote').textContent = t('usdNote');
  document.getElementById('footAbout').textContent = t('footAbout');
  document.getElementById('footDisc').textContent = t('footDisc');
  document.getElementById('drawerTitle').textContent = t('drawerTitle');
  document.getElementById('totalLabel').textContent = t('total');
  document.getElementById('cartNote').textContent = t('cartNote');
  document.getElementById('dlgClose').textContent = t('close');
  document.getElementById('langAr').classList.toggle('on', lang === 'ar');
  document.getElementById('langEn').classList.toggle('on', lang === 'en');
  var sort = document.getElementById('sort');
  sort.innerHTML = '';
  [['featured', t('sortFeatured')], ['rating', t('sortRating')], ['discount', t('sortDiscount')], ['price-asc', t('sortPriceAsc')], ['price-desc', t('sortPriceDesc')]].forEach(function(o){
    var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; sort.appendChild(op);
  });
  var cats = [['all', t('all')], ['electronics', lang === 'en' ? 'Electronics' : 'إلكترونيات'], ['fashion', lang === 'en' ? 'Fashion' : 'موضة'], ['gaming', lang === 'en' ? 'Gaming' : 'ألعاب']];
  var catsEl = document.getElementById('cats');
  catsEl.innerHTML = '';
  cats.forEach(function(c){
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = c[1]; b.setAttribute('data-cat', c[0]);
    b.classList.toggle('on', cat === c[0]);
    b.onclick = function(){ cat = c[0]; applyLang(); render(); };
    catsEl.appendChild(b);
  });
  var cols = document.getElementById('cols');
  cols.innerHTML = '';
  [['electronics', '🔧', 'Electronics', 'إلكترونيات'], ['fashion', '⌚', 'Fashion', 'موضة'], ['gaming', '🖱️', 'Gaming', 'ألعاب']].forEach(function(c){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'col ' + c[0];
    var h = document.createElement('h3'); h.textContent = c[2] === 'Electronics' ? (lang === 'en' ? 'Electronics' : 'إلكترونيات') : (lang === 'en' ? c[2] : c[3]);
    var s = document.createElement('span'); s.textContent = c[1] + ' · ' + (lang === 'en' ? 'Shop now' : 'تسوّق دلوقتي');
    b.append(h, s);
    b.onclick = function(){ cat = c[0]; document.getElementById('products').scrollIntoView({behavior: 'smooth'}); applyLang(); render(); };
    cols.appendChild(b);
  });
  var trust = document.getElementById('trust');
  trust.innerHTML = '';
  [[t('trust1t'), t('trust1s'), '🔒'], [t('trust2t'), t('trust2s'), '🛡️'], [t('trust3t'), t('trust3s'), '🚚']].forEach(function(x){
    var d = document.createElement('div');
    var ic = document.createElement('div'); ic.style.fontSize = '30px'; ic.textContent = x[2];
    var b = document.createElement('b'); b.textContent = x[0];
    var s = document.createElement('span'); s.textContent = x[1];
    d.append(ic, b, s);
    trust.appendChild(d);
  });
}

function render(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var sort = document.getElementById('sort').value;
  var maxRaw = parseFloat(document.getElementById('maxPrice').value);
  var max = isNaN(maxRaw) ? NaN : (lang === 'en' ? maxRaw * rate : maxRaw);
  var list = all.filter(function(p){
    if (cat !== 'all' && p.category !== cat) return false;
    if (q && (p.name || '').toLowerCase().indexOf(q) === -1 && (p.name_en || '').toLowerCase().indexOf(q) === -1) return false;
    if (!isNaN(max) && p.price_egp > max) return false;
    return true;
  });
  if (sort === 'rating') list.sort(function(a, b){ return (b.rating || 0) - (a.rating || 0); });
  if (sort === 'discount') list.sort(function(a, b){ return (b.discount_percent || 0) - (a.discount_percent || 0); });
  if (sort === 'price-asc') list.sort(function(a, b){ return a.price_egp - b.price_egp; });
  if (sort === 'price-desc') list.sort(function(a, b){ return b.price_egp - a.price_egp; });

  var el = document.getElementById('list');
  el.innerHTML = '';
  if (!list.length){
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = t('empty');
    el.appendChild(e);
    return;
  }
  list.forEach(function(p){
    var c = document.createElement('div');
    c.className = 'card';
    var imgWrap = document.createElement('div'); imgWrap.className = 'img';
    if (p.image){
      var im = document.createElement('img');
      im.src = p.image; im.alt = loc(p); im.loading = 'lazy';
      im.onerror = function(){ imgWrap.innerHTML = ''; var ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = p.icon || '🛍️'; imgWrap.appendChild(ph); };
      imgWrap.appendChild(im);
    } else {
      var ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = p.icon || '🛍️';
      imgWrap.appendChild(ph);
    }
    if (p.discount_percent){
      var bd = document.createElement('span'); bd.className = 'badge-off'; bd.textContent = (lang === 'en' ? '-' + p.discount_percent + '% ' + t('off') : t('off') + ' ' + p.discount_percent + '%');
      imgWrap.appendChild(bd);
    }
    var body = document.createElement('div'); body.className = 'body';
    var ct = document.createElement('div'); ct.className = 'cat'; ct.textContent = locCat(p);
    var nm = document.createElement('div'); nm.className = 'name'; nm.textContent = loc(p);
    var st = document.createElement('div'); st.className = 'stars'; st.innerHTML = stars(p.rating);
    var pr = document.createElement('div'); pr.className = 'price'; pr.textContent = fmt(p.price_egp);
    if (p.old_price_egp){
      var o = document.createElement('span'); o.className = 'old'; o.textContent = fmt(p.old_price_egp);
      pr.appendChild(o);
    }
    var sn = document.createElement('div'); sn.className = 'sales';
    var parts = [];
    if (p.rating) parts.push(t('rating') + ' ' + p.rating + ' ' + t('outOf5'));
    if (locSales(p)) parts.push(locSales(p));
    sn.textContent = parts.join(' · ');
    var btns = document.createElement('div'); btns.className = 'btns';
    var det = document.createElement('button'); det.type = 'button'; det.className = 'btn ghost'; det.textContent = t('details');
    det.onclick = function(){ showDetails(p); };
    var add = document.createElement('button'); add.type = 'button'; add.className = 'btn dark'; add.textContent = t('addToCart');
    add.onclick = function(){ addToCart(p); add.textContent = t('added'); setTimeout(function(){ add.textContent = t('addToCart'); }, 1200); };
    var buy = document.createElement('a'); buy.className = 'btn red'; buy.href = p.affiliate_link; buy.target = '_blank'; buy.rel = 'nofollow sponsored noopener'; buy.textContent = t('buyNow');
    btns.append(det, add, buy);
    body.append(ct, nm, st, pr, sn, btns);
    c.append(imgWrap, body);
    el.appendChild(c);
  });
}

function addToCart(p){
  var c = getCart();
  var found = null;
  c.forEach(function(i){ if (i.id === p.id) found = i; });
  if (found) found.qty += 1;
  else c.push({id: p.id, qty: 1});
  setCart(c);
  renderCart();
}

function renderCart(){
  var box = document.getElementById('cartItems');
  box.innerHTML = '';
  var c = getCart();
  var total = 0;
  if (!c.length){
    var e = document.createElement('div'); e.className = 'empty'; e.textContent = t('cartEmpty');
    box.appendChild(e);
  }
  c.forEach(function(i){
    var p = null;
    all.forEach(function(x){ if (x.id === i.id) p = x; });
    if (!p) return;
    total += p.price_egp * i.qty;
    var row = document.createElement('div'); row.className = 'ci';
    if (p.image){ var im = document.createElement('img'); im.src = p.image; im.alt = ''; row.appendChild(im); }
    var mid = document.createElement('div'); mid.style.flex = '1';
    var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = loc(p) + ' × ' + i.qty;
    var lk = document.createElement('a'); lk.href = p.affiliate_link; lk.target = '_blank'; lk.rel = 'nofollow sponsored noopener'; lk.textContent = t('buyOn'); lk.style.cssText = 'font-size:12px;color:#e62e04;font-weight:bold';
    var rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rm'; rm.textContent = t('remove');
    rm.onclick = function(){ setCart(getCart().filter(function(x){ return x.id !== i.id; })); renderCart(); };
    mid.append(nm, lk, document.createElement('br'), rm);
    var pr = document.createElement('div'); pr.className = 'pr'; pr.textContent = fmt(p.price_egp * i.qty);
    row.append(mid, pr);
    box.appendChild(row);
  });
  document.getElementById('cartTotal').textContent = fmt(total);
}

function openDrawer(){
  renderCart();
  document.getElementById('drawer').classList.remove('hidden');
  document.getElementById('overlay').classList.remove('hidden');
}
function closeDrawer(){
  document.getElementById('drawer').classList.add('hidden');
  document.getElementById('overlay').classList.add('hidden');
}

function showDetails(p){
  var imgBox = document.getElementById('dlgImg');
  imgBox.innerHTML = '';
  if (p.image){ var im = document.createElement('img'); im.src = p.image; im.alt = loc(p); imgBox.appendChild(im); }
  document.getElementById('dlgName').textContent = loc(p);
  document.getElementById('dlgStars').innerHTML = stars(p.rating);
  var pr = document.getElementById('dlgPrice');
  pr.textContent = fmt(p.price_egp);
  if (p.old_price_egp){ var o = document.createElement('span'); o.className = 'old'; o.textContent = fmt(p.old_price_egp); pr.appendChild(o); }
  var lines = [];
  if (locDesc(p)) lines.push(locDesc(p));
  if (p.old_price_egp) lines.push(t('priceBefore') + ': ' + fmt(p.old_price_egp));
  if (p.discount_percent) lines.push(t('discount') + ': ' + p.discount_percent + '%');
  if (p.rating) lines.push(t('rating') + ': ' + p.rating + ' ' + t('outOf5'));
  if (locSales(p)) lines.push(locSales(p));
  if (locCat(p)) lines.push(t('category') + ': ' + locCat(p));
  document.getElementById('dlgBody').textContent = lines.join(' — ');
  document.getElementById('dlgAdd').textContent = t('addToCart');
  document.getElementById('dlgAdd').onclick = function(){ addToCart(p); document.getElementById('dlg').close(); openDrawer(); };
  var buy = document.getElementById('dlgBuy');
  buy.href = p.affiliate_link;
  buy.textContent = t('viewOn');
  document.getElementById('dlg').showModal();
}

document.getElementById('langAr').onclick = function(){ lang = 'ar'; try { localStorage.setItem('hs-lang', 'ar'); } catch(e) {} applyLang(); render(); renderCart(); };
document.getElementById('langEn').onclick = function(){ lang = 'en'; try { localStorage.setItem('hs-lang', 'en'); } catch(e) {} applyLang(); render(); renderCart(); };
document.getElementById('q').addEventListener('input', render);
document.getElementById('sort').addEventListener('change', render);
document.getElementById('maxPrice').addEventListener('input', render);
document.getElementById('searchBtn').onclick = function(){ document.getElementById('products').scrollIntoView({behavior: 'smooth'}); };
document.getElementById('cartBtn').onclick = openDrawer;
document.getElementById('drawerClose').onclick = closeDrawer;
document.getElementById('overlay').onclick = closeDrawer;
document.getElementById('dlgClose').onclick = function(){ document.getElementById('dlg').close(); };

document.getElementById('loadingMsg').textContent = t('loading');
applyLang();
updateCartBadge();
renderCart();

fetch('products.json', {cache: 'no-store'})
  .then(function(r){ if (!r.ok) throw new Error('products.json not found'); return r.json(); })
  .then(function(d){
    if (d.usd_rate) rate = d.usd_rate;
    all = (d.products || []).filter(function(p){ return p.affiliate_link && p.affiliate_link.indexOf('s.click.aliexpress.com') === 8; });
    render();
  })
  .catch(function(){
    document.getElementById('list').innerHTML = '<div class="empty">' + t('loadFail') + '</div>';
  });
</script>
</body>
</html>
